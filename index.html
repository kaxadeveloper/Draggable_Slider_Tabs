<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Slider Tabs</title>
    <script src="https://kit.fontawesome.com/27d4dbe998.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="icon"><i id="left" class="fa-solid fa-angle-left"></i></div>
        <ul class="tabs-box">
            <li class="tab">Coding</li>
            <li class="tab active">JavaScript</li>
            <li class="tab">Java</li>
            <li class="tab">Python</li>
            <li class="tab">PHP</li>
            <li class="tab">HTML</li>
            <li class="tab">CSS</li>
            <li class="tab">Markup</li>
            <li class="tab">App</li>
            <li class="tab">React</li>
            <li class="tab">Angular</li>
            <li class="tab">String</li>
            <li class="tab">icon</li>
            <li class="tab">Digital</li>
            <li class="tab">Language</li>
        </ul>
        <div class="icon"><i id="right" class="fa-solid fa-angle-right"></i></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
